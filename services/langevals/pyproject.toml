[project]
name = "langevals"
version = "3.0.0"
description = "A platform to evaluate LLM outputs using various evaluators."
authors = [{name = "Rogerio Chaves", email = "rogerio@langwatch.ai"}]
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
    "pytest>=8.1.2",
    "fastapi>=0.115.11",
    "pydantic>=2.4.0",
    "python-dotenv==1.2.2",
    "mangum>=0.17.0",
    "pandas>=2.2.2",
    "markdown>=3.6",
    "uvicorn>=0.29.0",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "nest-asyncio>=1.6.0",
    "pip-licenses>=5.5.0",
    "langevals-core",
]

[project.optional-dependencies]
azure = ["langevals-azure"]
openai = ["langevals-openai"]
ragas = ["langevals-ragas"]
lingua = ["langevals-lingua"]
langevals = ["langevals-langevals"]
presidio = ["langevals-presidio"]
topic_clustering = ["langevals-topic_clustering"]
all = [
    "langevals-azure",
    "langevals-langevals",
    "langevals-lingua",
    "langevals-ragas",
    "langevals-presidio",
    "langevals-openai",
    "langevals-topic_clustering",
]

[project.scripts]
langevals-server = "langevals.server:main"

[project.entry-points.pytest11]
pass_rate_plugin = "langevals.pytest_plugins.pass_rate_plugin"

[dependency-groups]
dev = [
    "toml>=0.10.2",
    "tomli-w>=1.0.0",
    "grevillea>=0.0.1",
    "litellm>=1.79.0",
    "instructor>=1.2.2",
    "pytest-xdist>=3.5.0",
    "flaky>=3.8.1",
    "ipykernel>=6.29.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langevals"]

[tool.uv]
exclude-newer = "7 days"
override-dependencies = [
    "langchain>=0.3.30",
    # security: GHSA-f4xh-w4cj-qxq8 — LangSmith SDK TracingMiddleware arbitrary
    # server-side file read; patched in 0.8.18.
    "langsmith>=0.8.18",
    # Force a patched strawberry-graphql (GHSA-fr49-mhgj-crfc, GHSA-qfwv-87qj-98xq,
    # GHSA-x97m-qp5c-w9xj). arize-phoenix 14.6.0 pins it to 0.314.3; the patched
    # 0.316.0 is API-compatible with Phoenix and is the version Phoenix itself moved
    # to in 16.4.0.
    "strawberry-graphql>=0.316.0",
    "pydantic-settings>=2.14.2",  # security: pydantic-settings advisory (#1517)
    # security: GHSA circular JSON Schema $ref unbounded-CPU DoS; patched in 0.60.1.
    "json-repair>=0.60.1",
]

# Transitive-dependency security floors. These only raise a lower bound, so a
# consumer that caps below them surfaces as a resolution error rather than
# being silently forced onto an incompatible version.
constraint-dependencies = [
    "pillow>=12.3.0",  # security: 13 pillow advisories (decoder overflows, TiffImagePlugin DoS)
    "litellm>=1.84.0",  # security: 11 litellm advisories incl. two CRITICAL auth bypasses
    "nltk>=3.10.0",  # security: nltk advisories, reached via rouge-score
    "pyasn1>=0.6.4",  # security: pyasn1 advisories, via pyasn1-modules/ldap3/rsa
    "aiohttp>=3.14.3",  # security: aiohttp advisories
    "cryptography>=50.0.0",  # security: cryptography advisory
    "h2>=4.4.1",  # security: h2 advisory (#2065)
    "setuptools>=83.0.0",  # security: setuptools advisory
    "torch>=2.13.0",  # security: torch advisory (#2025)
    # The langchain line is pinned to 0.x by ragas, not by choice. Every 1.x
    # family member needs langchain-core >=1.2.31, and core 1.x removed
    # langchain_core.tracers.langchain_v1, which langchain-community only
    # stopped importing at 0.4.2. But community 0.4.2 dropped
    # langchain_community.chat_models.vertexai, which ragas imports
    # unconditionally in ragas/llms/base.py, and 0.4.3 is its newest release.
    # Both legs fail at import, verified with `pytest --collect-only`. Tracked
    # in #3922; revisit when ragas publishes a release that drops that import.
    "langchain-core>=0.3.78,<1.0.0",
    "langchain-openai>=0.3.34,<0.4.0",
    "langchain<1.0.0",
]

[tool.uv.workspace]
members = [
    "langevals_core",
    "evaluators/*",
    "notebooks",
]

[tool.uv.sources]
langevals-core = { workspace = true }
langevals-azure = { workspace = true }
langevals-openai = { workspace = true }
langevals-ragas = { workspace = true }
langevals-lingua = { workspace = true }
langevals-langevals = { workspace = true }
langevals-presidio = { workspace = true }
langevals-topic_clustering = { workspace = true }

# PyTorch CPU index for Linux
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
